name: Publish project to Serial Hobbyist

on:
  workflow_dispatch:
    inputs:
      title:
        description: Project or update title
        required: true
        type: string
      id:
        description: Existing project ID to update; leave blank to create a new project
        required: false
        type: string
      platform:
        description: Where the project/update lives
        required: true
        type: choice
        options:
          - other
          - youtube
          - instagram
          - tiktok
          - facebook
          - x
          - github
      url:
        description: Public link for this project or post
        required: true
        type: string
      thumbnail:
        description: Public image URL (optional)
        required: false
        type: string
      date:
        description: Publication date (YYYY-MM-DD)
        required: true
        type: string
      description:
        description: Short description shown on the project card
        required: true
        type: string
      tags:
        description: Comma-separated tags, e.g. robotics, esp8266, build-log
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: serial-hobbyist-project-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and publish project data
        uses: actions/github-script@v7
        env:
          TITLE: ${{ inputs.title }}
          PROJECT_ID: ${{ inputs.id }}
          PLATFORM: ${{ inputs.platform }}
          PROJECT_URL: ${{ inputs.url }}
          THUMBNAIL: ${{ inputs.thumbnail }}
          PUBLISH_DATE: ${{ inputs.date }}
          DESCRIPTION: ${{ inputs.description }}
          TAGS: ${{ inputs.tags }}
        with:
          script: |
            const required = ['TITLE', 'PLATFORM', 'PROJECT_URL', 'PUBLISH_DATE', 'DESCRIPTION'];
            for (const key of required) {
              if (!process.env[key]?.trim()) throw new Error(`Missing required field: ${key}`);
            }

            const validUrl = (value, field, optional = false) => {
              if (!value && optional) return '';
              let parsed;
              try { parsed = new URL(value); } catch { throw new Error(`${field} must be a valid URL.`); }
              if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error(`${field} must use http or https.`);
              return parsed.href;
            };

            const title = process.env.TITLE.trim();
            const platform = process.env.PLATFORM.trim().toLowerCase();
            const url = validUrl(process.env.PROJECT_URL.trim(), 'Project URL');
            const thumbnail = validUrl(process.env.THUMBNAIL.trim(), 'Thumbnail URL', true);
            const date = process.env.PUBLISH_DATE.trim();
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(Date.parse(date + 'T00:00:00Z'))) {
              throw new Error('Date must be a real date in YYYY-MM-DD format.');
            }

            const id = process.env.PROJECT_ID.trim() ||
              title.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') +
              '-' + date.replaceAll('-', '');
            const tags = [...new Set((process.env.TAGS || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean))];

            const path = 'projects.json';
            let existing = { updated: '', projects: [] };
            let sha;
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path, ref: context.ref
              });
              if (Array.isArray(file.data) || !file.data.content) throw new Error('projects.json is not a file.');
              sha = file.data.sha;
              existing = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const projects = Array.isArray(existing) ? existing : (existing.projects || []);
            const entry = { id, title, platform, url, thumbnail, date, description: process.env.DESCRIPTION.trim(), tags };
            const index = projects.findIndex(p => p.id === id);
            if (index >= 0) projects[index] = entry;
            else projects.push(entry);

            projects.sort((a, b) => new Date(b.date) - new Date(a.date));
            const next = JSON.stringify({ updated: new Date().toISOString(), projects }, null, 2) + '\n';
            const message = index >= 0 ? `Update project: ${title}` : `Publish project: ${title}`;

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message,
              content: Buffer.from(next, 'utf8').toString('base64'),
              branch: context.ref.replace('refs/heads/', ''),
              ...(sha ? { sha } : {})
            });

            core.summary
              .addHeading('Serial Hobbyist project published')
              .addTable([
                [{data:'Field',header:true},{data:'Value',header:true}],
                ['Title', title],
                ['Project ID', id],
                ['Action', index >= 0 ? 'Updated existing project' : 'Added new project'],
                ['Platform', platform],
                ['Date', date],
                ['Website feed', 'projects.json']
              ])
              .addLink('Open the website repository', context.payload.repository.html_url)
              .write();
